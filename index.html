<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff1f5">
  <title>Calendario · Diciembre 2026</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #49353d;
      --muted: #927d88;
      --line: #f0dce4;
      --accent: #bd6f8d;
      --paper: #fff;
      --background: #fff1f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 38px 24px 48px;
      background: var(--background);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    button {
      border: 1px solid #ead4de;
      border-radius: 999px;
      padding: 10px 16px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      font-weight: 400;
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin: 10px 0 28px;
      color: var(--muted);
      font-size: 1rem;
    }

    .calendar-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 14px 40px rgb(125 71 94 / 8%);
    }

    .calendar {
      display: grid;
      min-width: 700px;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekday {
      padding: 15px 10px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-align: center;
      text-transform: uppercase;
    }

    .day,
    .empty {
      min-height: 148px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .day:nth-child(7n),
    .empty:nth-child(7n) {
      border-right: 0;
    }

    .day {
      display: flex;
      flex-direction: column;
      padding: 11px;
    }

    .day-number {
      display: flex;
      width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .day textarea {
      width: 100%;
      min-height: 85px;
      flex: 1;
      resize: vertical;
      border: 0;
      outline: 0;
      padding: 7px 2px 2px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .day textarea::placeholder {
      color: #c6aab6;
    }

    .day:focus-within {
      background: #fff7fa;
      box-shadow: inset 0 0 0 2px rgb(189 111 141 / 45%);
    }

    .save-status {
      min-height: 1.25em;
      margin: 15px 2px 0;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: right;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 14px 32px;
      }

      .subtitle {
        margin-bottom: 20px;
      }

      .calendar-wrap {
        border-radius: 12px;
      }

      .calendar {
        min-width: 630px;
      }

      .day,
      .empty {
        min-height: 120px;
      }
    }

    @media print {
      body {
        padding: 0;
        background: white;
      }

      .topline button,
      .save-status {
        display: none;
      }

      .calendar-wrap {
        overflow: visible;
        border-radius: 0;
        box-shadow: none;
      }

      .calendar {
        min-width: 0;
      }

      .day,
      .empty {
        min-height: 120px;
      }

      .day textarea {
        overflow: hidden;
        resize: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="topline">
      <p class="eyebrow">Tu calendario</p>
      <button type="button" onclick="window.print()">Imprimir</button>
    </div>
    <h1>Diciembre <span>2026</span></h1>
    <p class="subtitle">Organiza tus citas, clientas y servicios de manicura día a día.</p>

    <section class="calendar-wrap" aria-label="Calendario de diciembre de 2026">
      <div class="calendar" id="calendar">
        <div class="weekday">Lun</div>
        <div class="weekday">Mar</div>
        <div class="weekday">Mié</div>
        <div class="weekday">Jue</div>
        <div class="weekday">Vie</div>
        <div class="weekday">Sáb</div>
        <div class="weekday">Dom</div>
      </div>
    </section>
    <p class="save-status" id="save-status" role="status" aria-live="polite">Tus citas se guardan automáticamente en este dispositivo.</p>
  </main>

  <script>
    const calendar = document.getElementById("calendar");
    const storageKey = "calendario-diciembre-2026";
    const savedNotes = JSON.parse(localStorage.getItem(storageKey) || "{}");
    const firstWeekday = (new Date(2026, 11, 1).getDay() + 6) % 7;
    const daysInMonth = 31;

    for (let blank = 0; blank < firstWeekday; blank += 1) {
      const emptyCell = document.createElement("div");
      emptyCell.className = "empty";
      emptyCell.setAttribute("aria-hidden", "true");
      calendar.appendChild(emptyCell);
    }

    for (let day = 1; day <= daysInMonth; day += 1) {
      const cell = document.createElement("div");
      cell.className = "day";

      const number = document.createElement("div");
      number.className = "day-number";
      number.textContent = day;
      cell.appendChild(number);

      const note = document.createElement("textarea");
      note.setAttribute("aria-label", `Notas para el ${day} de diciembre`);
      note.placeholder = "Escribe aquí...";
      note.value = savedNotes[day] || "";
      note.addEventListener("input", () => {
        savedNotes[day] = note.value;
        localStorage.setItem(storageKey, JSON.stringify(savedNotes));
        document.getElementById("save-status").textContent = "Cambios guardados en este dispositivo";
      });
      cell.appendChild(note);
      calendar.appendChild(cell);
    }
  </script>
</body>
</html>
